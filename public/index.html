<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>ColocManager — Gestion de Colocation</title>
    <meta name="description" content="Gestion des achats et du nettoyage équitable en colocation" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ColocManager" />
    <meta name="application-name" content="ColocManager" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Home Screen Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />

    <!-- Standard Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Prevent iOS Standalone PWA from opening internal links in Safari / Safari View Controller -->
    <script>
      (function() {
        var isStandalone = (('standalone' in window.navigator) && window.navigator.standalone) ||
          (typeof window.matchMedia === 'function' && window.matchMedia('(display-mode: standalone)').matches);

        if (isStandalone) {
          document.addEventListener('click', function(e) {
            var node = e.target;
            while (node && node.nodeName !== 'A' && node.nodeName !== 'HTML') {
              node = node.parentNode;
            }
            if (node && node.nodeName === 'A' && node.href) {
              var href = node.getAttribute('href');
              if (!href) return;
              var isExternal = /^https?:\/\//i.test(href) && node.origin !== window.location.origin;
              var isSpecial = /^(mailto:|tel:|sms:|javascript:)/i.test(href);

              if (!isExternal && !isSpecial && href !== '#' && !node.getAttribute('target')) {
                e.preventDefault();
                var targetPath = node.pathname + (node.search || '') + (node.hash || '');
                if (window.location.pathname + window.location.search + window.location.hash !== targetPath) {
                  if (window.history && window.history.pushState) {
                    window.history.pushState(null, '', targetPath);
                    window.dispatchEvent(new PopStateEvent('popstate'));
                  } else {
                    window.location.href = node.href;
                  }
                }
              }
            }
          }, false);
        }
      })();
    </script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(
            function(registration) {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            },
            function(err) {
              console.log('ServiceWorker registration failed: ', err);
            }
          );
        });
      }
    </script>

    <!-- MaterialCommunityIcons font definition for React Native Paper & @expo/vector-icons -->
    <style id="material-community-icons-font">
      @font-face {
        font-family: 'MaterialCommunityIcons';
        src: url('https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.woff2?v=7.4.47') format('woff2'),
             url('https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf?v=7.4.47') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
    </style>

    <!-- Global layout, responsive containment, and zero-overflow rules -->
    <style id="expo-reset">
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background-color: #0F172A;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 100%;
        margin: 0 auto;
        height: 100%;
        position: relative;
        overflow-x: hidden;
      }
      @media (min-width: 768px) {
        #root {
          max-width: 1100px;
          box-shadow: 0 0 40px rgba(0, 0, 0, 0.25);
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      Vous devez activer JavaScript pour exécuter ColocManager.
    </noscript>
    <div id="root"></div>
  </body>
</html>
